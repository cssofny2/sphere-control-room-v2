name: Foundation validation

on:
  push:
    branches: [feature/cr-102-cancellable-runner]
  pull_request:
    branches: [main, feature/cr-101-validated-plans]

permissions:
  contents: read

concurrency:
  group: foundation-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression suites
        run: npm test
      - name: Run mounted sweep lifecycle tests
        run: npm ci --prefix tests/mounted --ignore-scripts && node scripts/mounted-sweep-lifecycle.test.mjs
      - name: Check types and production build
        run: npm run build
      - name: Check patch whitespace
        run: git diff --check
